<<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Calculadora de Média - NotaQuanto</title>

    <meta
        name="description"
        content="Calcule sua média e veja se você alcançou a média necessária."
    >

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <main class="card">


        <!-- VOLTAR -->

        <a
            href="../../index.html"
            class="voltar"
        >
            ← Voltar para o NotaQuanto
        </a>


        <!-- LOGO -->

        <div class="logo">
            📊
        </div>


        <!-- TÍTULO -->

        <h1>
            Calculadora de média
        </h1>

        <p class="subtitulo">
            Descubra sua média e veja se você alcançou a média necessária.
        </p>


        <!-- MÉDIA NECESSÁRIA -->

        <div class="campo">

            <label for="mediaNecessaria">
                🎯 Qual média você precisa?
            </label>

            <input
                type="number"
                id="mediaNecessaria"
                min="0"
                max="10"
                step="0.1"
                value="7"
                placeholder="Ex: 7"
            >

        </div>


        <!-- NOTA 1 -->

        <div class="campo">

            <label for="nota1">
                📝 Nota 1
            </label>

            <input
                type="number"
                id="nota1"
                min="0"
                max="10"
                step="0.1"
                placeholder="Digite sua nota"
            >

        </div>


        <!-- NOTA 2 -->

        <div class="campo">

            <label for="nota2">
                📝 Nota 2
            </label>

            <input
                type="number"
                id="nota2"
                min="0"
                max="10"
                step="0.1"
                placeholder="Digite sua nota"
            >

        </div>


        <!-- NOTA 3 -->

        <div class="campo">

            <label for="nota3">
                📝 Nota 3
            </label>

            <input
                type="number"
                id="nota3"
                min="0"
                max="10"
                step="0.1"
                placeholder="Digite sua nota"
            >

        </div>


        <!-- BOTÕES -->

        <div class="botoes">

            <button
                class="botao-calcular"
                onclick="calcularMedia()"
            >
                Calcular minha média 🚀
            </button>

            <button
                class="botao-limpar"
                onclick="limpar()"
            >
                🔄 Limpar
            </button>

        </div>


        <!-- RESULTADO -->

        <div id="resultado"></div>


        <!-- RODAPÉ -->

        <p class="rodape">
            NotaQuanto • Sua nota, sem complicação.
        </p>


    </main>


    <script src="script.js"></script>

</body>

</html>
