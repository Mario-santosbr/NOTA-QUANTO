<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quanto Preciso Tirar? - NotaQuanto</title>

    <meta
        name="description"
        content="Descubra quanto você precisa tirar na próxima prova para alcançar sua média."
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="card">

        <a href="../../index.html" class="voltar">
            ← Voltar para o NotaQuanto
        </a>


        <div class="logo">
            📚
        </div>


        <h1>Quanto preciso tirar?</h1>

        <p class="subtitulo">
            Descubra quanto você precisa tirar na próxima prova.
        </p>


        <div class="campo">

            <label for="mediaNecessaria">
                🎯 Média para passar
            </label>

            <input
                type="number"
                id="mediaNecessaria"
                value="7"
                min="0"
                max="10"
                step="0.1"
                placeholder="Ex: 7"
            >

        </div>


        <div class="campo">

            <label for="nota1">
                📝 Nota 1
            </label>

            <input
                type="number"
                id="nota1"
                min="0"
                max="10"
                step="0.1"
                placeholder="Digite sua nota"
            >

        </div>


        <div class="campo">

            <label for="nota2">
                📝 Nota 2
            </label>

            <input
                type="number"
                id="nota2"
                min="0"
                max="10"
                step="0.1"
                placeholder="Digite sua nota"
            >

        </div>


        <div class="botoes">

            <button
                class="botao-calcular"
                onclick="calcular()"
            >
                Calcular minha nota 🚀
            </button>

            <button
                class="botao-limpar"
                onclick="limpar()"
            >
                🔄 Limpar
            </button>

        </div>


        <div id="resultado"></div>


        <p class="rodape">
            NotaQuanto • Sua nota, sem complicação.
        </p>

    </main>


    <script src="script.js"></script>

</body>

</html>
